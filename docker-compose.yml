

services:
  # Production service
  court-listener-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: court-listener-mcp:latest
    container_name: court-listener-mcp-server
    # Run the MCP server with HTTP (streamable) transport
    command: python -m app
    ports:
      - "8785:8785"
    # Liveness probe against the unauthenticated /health route
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8785/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    env_file:
      - .env
    environment:
      - LOG_LEVEL=INFO
      - API_BASE_URL=https://www.courtlistener.com/api/rest/v4
    restart: unless-stopped
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge
