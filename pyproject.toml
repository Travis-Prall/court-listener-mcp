[project]
name = "court-listener-mcp-server"
version = "0.2.0"
description = "Model Context Protocol server providing LLM-friendly access to legal cases and court data through the CourtListener API v4"
authors = [{ name = "Travis-Prall", email = "smart@travisprall.com" }]
readme = "README.md"
license = { text = "" }
requires-python = ">=3.14.0"
keywords = ["mcp", "courtlistener", "legal", "cases", "opinions", "api"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
]

dependencies = [
  "fastmcp>=4.0.3",
  "httpx>=0.28.1",
  "loguru>=0.7.3",
  "python-dotenv>=1.2.3",
  "pydantic>=2.13.5",
  "pydantic-settings>=2.15.0",
  "psutil>=7.2.2",
  "citeurl[full]>=12.0.3",
  # citeurl>=12 imports `markdown` in citeurl/__init__.py but does not declare it
  "markdown>=3.10.3",
]

[project.urls]
Homepage = "https://www.travisprall.com/"
Repository = "https://github.com/Travis-Prall/court-listener-mcp"
Issues = "https://github.com/Travis-Prall/court-listener-mcp/issues"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  # Testing
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "respx>=0.23.1",  # HTTP mocking for httpx (keeps tests off the live API)
  # Code quality
  "mypy>=2.3.1",
  "ruff>=0.16.6",
  "types-psutil>=7.2.2",  # Type stubs for psutil (mypy)
  # Development tools
  "ipython>=9.17.1",
  "rich>=15.0.0",
]

[tool.uv.sources]
# Add any custom package sources if needed

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
plugins = ["pydantic.mypy"]

follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true

# for strict mypy: (this is the tricky one :-))
disallow_untyped_defs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.hatch.build.targets.wheel]
packages = ["app"]
